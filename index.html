<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Внимание!</title>
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
        }
        h1 {
            font-size: 3em;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
        p {
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <h1>ВНИМАНИЕ!</h1>
    <p>Ваш телефон взломан. 🕵️‍♂️</p>
    <p>Шутка! 😂 Это просто пранк.</p>
    <p>Все ваши данные в безопасности.</p>
</body>
</html>
